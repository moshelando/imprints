<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Pennywise data protection flow</title><desc id="d">A diagram showing read-only financial connections moving through encrypted processing into Pennywise explanations and user controls.</desc><rect width="900" height="520" rx="44" fill="#f5f1ff"/><g font-family="Arial,sans-serif" fill="#20202a"><rect x="42" y="182" width="190" height="156" rx="34" fill="#c9f7da"/><text x="137" y="238" text-anchor="middle" font-size="18" font-weight="700">Your accounts</text><text x="137" y="272" text-anchor="middle" font-size="13">read-only connection</text><text x="137" y="298" text-anchor="middle" font-size="13">permission controlled</text><path d="M248 260h132" stroke="#4f3cf2" stroke-width="10" stroke-linecap="round"/><circle cx="314" cy="260" r="16" fill="#4f3cf2"/><rect x="396" y="130" width="220" height="260" rx="38" fill="#4f3cf2"/><text x="506" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="white">Pennywise</text><text x="506" y="256" text-anchor="middle" font-size="13" fill="#e9e6ff">encrypted processing</text><text x="506" y="282" text-anchor="middle" font-size="13" fill="#e9e6ff">minimal data use</text><text x="506" y="308" text-anchor="middle" font-size="13" fill="#e9e6ff">plain-language output</text><path d="M632 260h82" stroke="#4f3cf2" stroke-width="10" stroke-linecap="round"/><rect x="730" y="182" width="128" height="156" rx="34" fill="#ffd8a8"/><text x="794" y="238" text-anchor="middle" font-size="18" font-weight="700">You</text><text x="794" y="272" text-anchor="middle" font-size="13">see</text><text x="794" y="298" text-anchor="middle" font-size="13">control</text></g></svg>